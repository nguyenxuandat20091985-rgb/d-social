name: D Social build
on:
  push:
    branches: [main, feat/client-first-media-processing, feat/media-processing-v2-hybrid-pipeline]
  pull_request:
    branches: [main, feat/client-first-media-processing]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: deno check supabase/functions/process-media/index.ts
      - run: python -m pip install -r services/media-processing-service/requirements.txt
      - run: python -m py_compile services/media-processing-service/main.py services/media-processing-service/test_media_processing.py
      - run: python -m unittest discover -s services/media-processing-service -p 'test_*.py' -v
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm run build
